# ===================================================================
# MediKiosk Spring Boot Application Configuration
# ===================================================================
server.port=8080
spring.application.name=medikiosk-backend

# -------------------------------------------------------------------
# Profile 1: Default In-Memory H2 (Instant testing with no setup required)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:medikioskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------------------------------------------------
# Profile 2: PostgreSQL (Uncomment for Production / Local Postgres)
# -------------------------------------------------------------------
# spring.datasource.url=jdbc:postgresql://localhost:5432/medikiosk_db
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -------------------------------------------------------------------
# Profile 3: MySQL (Uncomment for MySQL)
# -------------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/medikiosk_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate DDL Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Script Initialization (Loads schema.sql and data.sql automatically)
spring.sql.init.mode=always

# Gemini AI API Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-2.5-flash

# File Upload Settings (Max 25MB for prescriptions/lab reports)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
